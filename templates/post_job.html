<!DOCTYPE html>
<html>
<head>
    <title>Post Job</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card p-4 shadow">
        <h2 class="mb-4">Post a Job</h2>

        <form method="POST">
            <div class="mb-3">
                <input type="text" name="title" class="form-control" placeholder="Job Title" required>
            </div>

            <div class="mb-3">
                <textarea name="description" class="form-control" placeholder="Job Description" required></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100">Post Job</button>
        </form>
    </div>
</div>

</body>
</html>
