<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card p-4 shadow">
        <h2 class="mb-4">Dashboard</h2>
        <p class="mt-3">
            ⭐ Rating: {{ user_data[0] if user_data[0] else 0 }}
        </p>

        <p>
            📊 Reliability Score: {{ user_data[1] }}
        </p>

        {% if role == "employer" %}
            <h4 class="text-primary">Employer Panel</h4>
            <p>You can post jobs.</p>
            <a href="/post_job" class="btn btn-primary mt-2">Post New Job</a>
            <a href="/my_jobs" class="btn btn-secondary mt-2">My Jobs</a>


        {% else %}
            <h4 class="text-success">Worker Panel</h4>
            <p>You can apply for jobs.</p>
            <a href="/jobs" class="btn btn-success mt-2">View Jobs</a>
            <a href="/my_work" class="btn btn-secondary mt-2">My Work</a>


        {% endif %}

        <a href="/logout" class="btn btn-danger mt-3">Logout</a>
    </div>
</div>

</body>
</html>
